<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Staff</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                href="{% url 'admin_dashboard' %}"
                class="navbar-brand fw-bold"
            >
                POS Billing Software
            </a>

            <span class="text-white">
                Add Staff
            </span>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="fw-bold mb-2">
                            Add Staff
                        </h1>

                        <p class="text-muted mb-4">
                            Add a new staff member to the POS system.
                        </p>


                        <form method="post">

                            {% csrf_token %}


                            <!-- Name -->
                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label fw-semibold"
                                >
                                    Staff Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter staff name"
                                    required
                                >

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter email address"
                                    required
                                >

                            </div>


                            <!-- Role -->
                            <div class="mb-4">

                                <label
                                    for="role"
                                    class="form-label fw-semibold"
                                >
                                    Role
                                </label>

                                <select
                                    id="role"
                                    name="role"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select role
                                    </option>

                                    <option value="Cashier">
                                        Cashier
                                    </option>

                                    <option value="Manager">
                                        Manager
                                    </option>

                                    <option value="Staff">
                                        Staff
                                    </option>

                                </select>

                            </div>


                            <!-- Buttons -->
                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-dark"
                                >
                                    Add Staff
                                </button>

                                <a
                                    href="{% url 'staff_list' %}"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>

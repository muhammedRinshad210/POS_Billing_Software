<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="{% url 'billing' %}"
            >
                POS Billing Software
            </a>

            <span class="text-white">
                Checkout
            </span>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="container py-5">


        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">


                <!-- Checkout Card -->
                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">


                        <h1 class="fw-bold mb-2">
                            Checkout
                        </h1>

                        <p class="text-muted mb-4">
                            Review your order and complete the payment.
                        </p>


                        <!-- Order Items -->
                        <h5 class="mb-3">
                            Order Summary
                        </h5>


                        {% for item in cart_items %}

                        <div
                            class="d-flex justify-content-between align-items-center border-bottom py-3"
                        >

                            <div>

                                <div class="fw-semibold">
                                    {{ item.product.name }}
                                </div>

                                <small class="text-muted">
                                    ₹{{ item.product.price }}
                                    ×
                                    {{ item.quantity }}
                                </small>

                            </div>


                            <div class="fw-semibold">

                                ₹{{ item.subtotal }}

                            </div>

                        </div>

                        {% endfor %}


                        <!-- Total -->
                        <div
                            class="d-flex justify-content-between align-items-center py-4"
                        >

                            <h4 class="mb-0">
                                Total
                            </h4>

                            <h3 class="mb-0 fw-bold">
                                ₹{{ total }}
                            </h3>

                        </div>


                        <!-- Payment Form -->
                        <form method="post">

                            {% csrf_token %}


                            <div class="mb-4">

                                <label
                                    for="payment_method"
                                    class="form-label fw-semibold"
                                >
                                    Payment Method
                                </label>


                                <select
                                    name="payment_method"
                                    id="payment_method"
                                    class="form-select"
                                    required
                                >

                                    <option value="Cash">
                                        Cash
                                    </option>

                                    <option value="Card">
                                        Card
                                    </option>

                                    <option value="UPI">
                                        UPI
                                    </option>

                                </select>

                            </div>


                            <!-- Buttons -->
                            <div
                                class="d-flex flex-column flex-sm-row gap-2"
                            >

                                <a
                                    href="{% url 'cart' %}"
                                    class="btn btn-outline-secondary"
                                >
                                    ← Back to Cart
                                </a>


                                <button
                                    type="submit"
                                    class="btn btn-primary flex-grow-1"
                                >
                                    Confirm Payment
                                </button>

                            </div>


                        </form>


                    </div>

                </div>


            </div>

        </div>


    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>

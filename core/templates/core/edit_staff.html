<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Staff | POS Billing</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            POS Billing Software
        </span>
    </div>
</nav>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2 class="fw-bold mb-1">Edit Staff</h2>
                    <p class="text-muted mb-0">
                        Update staff information
                    </p>
                </div>

                <a href="{% url 'staff_list' %}"
                   class="btn btn-outline-secondary">
                    Back
                </a>

            </div>


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}


                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Staff Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ staff.name }}"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ staff.email }}"
                                required
                            >

                        </div>


                        <!-- Role -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Role
                            </label>

                            <select
                                name="role"
                                class="form-select"
                                required
                            >

                                <option value="Cashier"
                                    {% if staff.role == "Cashier" %}selected{% endif %}>
                                    Cashier
                                </option>

                                <option value="Manager"
                                    {% if staff.role == "Manager" %}selected{% endif %}>
                                    Manager
                                </option>

                                <option value="Staff"
                                    {% if staff.role == "Staff" %}selected{% endif %}>
                                    Staff
                                </option>

                            </select>

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="{% url 'staff_list' %}"
                                class="btn btn-outline-secondary w-50"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-dark w-50"
                            >
                                Update Staff
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
